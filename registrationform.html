<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="reg.css">
</head>
<body>
    <center>
    <h1>Registration Form</h1>
    </center>
    <br>
    <fieldset>
        <center>
            <form action="" method="post">
            <table>
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <img src="C:\Users\Lenovo\OneDrive\Desktop\WhatsApp Image 2025-12-09 at 20.37.43_f7827599.jpg" alt="User Image" width="120" height="120" style="border-radius: 50%; border: 2px solid #ff6600;">
                    </td>
                </tr>
                <tr>
                <td><label for=""><b>First Name:</b></label></td>
                <td><input type="text" placeholder="First Name" required></td>
            </tr>
            <tr>
                <td><label for=""><b>Last Name:</b></label></td>
                <td><input type="text" placeholder="Last Name" required></td>
            </tr>
            
            <tr>
                <td><label for=""><b>Date:</b></label></td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td><label for=""><b>Email Address:</b></label></td>
                <td><input type="email" placeholder="Email Address" required></td>
            </tr>
              <tr>
                <td><label for=""><b>Mobile Number:</b></label></td>
                <td><input type="tel" placeholder="Mobile Number" required></td>
            </tr>
            <tr>
                <td><label for=""><b>Gender:</b></label></td>
                <td><input type="radio" name="gender" value="male"><label for="">Male</label>
                  <input type="radio" name="gender" value="female"><label for="">Female</label>
                </td>
            </tr>
            <tr>
                <td><label for=""><b>Password:</b></label></td>
                <td><input type="password" placeholder="Password" required></td>
            </tr>
               <tr>
                <td><label for=""><b>Confirm Password:</b></label></td>
                <td><input type="password" placeholder="Confirm Password" required></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <button class="btn">SIGN UP</button>
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <p>Have already an account? <a href="#">Login here</a></p>
                </td>
            </tr>
           
        </table>
    </form>
    </center>
    </fieldset>
</body>
</html>
